[package]
name = "t2d2"
version = "0.1.0"
edition = "2021"
description = "A vim-feeling, SIMPLE Rust TUI todo list."
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
strip = true